on:
  push:
    tags:
      - 'v*'

name: Deployment

# Necessario per creare la release su GitHub con gh.
permissions:
  contents: write

jobs:
  build:
    name: Github and WordPress releases
    # Versione fissa, come nel workflow dei test (ubuntu-latest passa a Ubuntu 26.04).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/v}" >> $GITHUB_ENV
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.4
          tools: composer
        env:
          fail-fast: true
      - name: Install Subversion and rsync
        # rsync serve a bin/run.sh svnsync.
        run: sudo apt-get update && sudo apt-get install -y subversion rsync
      # Prima di qualsiasi pubblicazione: il tag deve coincidere con Stable tag e Version.
      - name: Check version
        env:
          SVN_TAG: ${{ env.RELEASE_VERSION }}
        run: bash bin/run.sh checkversion
      - name: Build project
        env:
          ZIP_NAME: campi-moduli-italiani-v${{ env.RELEASE_VERSION }}.zip
        run: |
           make bundle
      # actions/create-release e actions/upload-release-asset sono archiviate (sola lettura)
      # dal 2021: la release si crea con la CLI gh, già presente sui runner.
      - name: Create GitHub release with the plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/campi-moduli-italiani-v${RELEASE_VERSION}.zip" \
            --title "Release v${RELEASE_VERSION}" \
            --verify-tag
      - name: Sync with SVN
        run: |
          make svnsync
      - name: Push to WordPress Plugin directory
        env:
          SVN_TAG: ${{ env.RELEASE_VERSION }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          make svnpush
